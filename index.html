<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frota Parada &gt;3 — Loc Frota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E14; --panel:#121620; --panel-2:#161B26; --border:#232838;
    --text:#E7EAF0; --text-muted:#8891A3; --text-dim:#5A6274;
    --blue:#3B82F6; --blue-dim:#1E3A6B;
    --critico:#FF5C5C; --critico-dim:#3D1B1E;
    --atencao:#F5A623; --atencao-dim:#3D2E10;
    --normal:#2ED3A6; --normal-dim:#123A30;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter', sans-serif; min-height:100vh;
    background-image:
      radial-gradient(circle at 15% 0%, rgba(59,130,246,0.06), transparent 40%),
      radial-gradient(circle at 85% 20%, rgba(46,211,166,0.04), transparent 35%);
  }
  a{color:inherit;}
  .mono{font-family:'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums;}
  .eyebrow{font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-dim);}
  .panel{background:var(--panel); border:1px solid var(--border); border-radius:4px; position:relative;}
  .panel::before, .panel::after{content:''; position:absolute; width:8px; height:8px; border:1px solid var(--text-dim); opacity:0.5;}
  .panel::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .panel::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }

  .wrap{max-width:1180px; margin:0 auto; padding:28px 24px 64px;}

  header{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;
    padding-bottom:20px; margin-bottom:22px; border-bottom:1px solid var(--border);
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .brand-mark{width:40px; height:40px; border-radius:9px; object-fit:cover; flex-shrink:0;}
  .brand-text h1{font-family:'Space Grotesk'; font-size:20px; font-weight:600; letter-spacing:0.01em; text-transform:uppercase;}
  .brand-text span{font-size:11px; color:var(--text-dim); font-family:'IBM Plex Mono';}

  .header-meta{display:flex; align-items:center; gap:14px; font-size:12px; color:var(--text-muted); font-family:'IBM Plex Mono';}
  .live-dot{width:7px; height:7px; border-radius:50%; background:var(--normal); flex-shrink:0; box-shadow:0 0 0 0 rgba(46,211,166,0.6); animation:pulse-dot 2s infinite;}
  .live-dot.stale{background:var(--critico); animation:none;}
  @keyframes pulse-dot{0%{box-shadow:0 0 0 0 rgba(46,211,166,0.5);}70%{box-shadow:0 0 0 6px rgba(46,211,166,0);}100%{box-shadow:0 0 0 0 rgba(46,211,166,0);}}
  #refresh-btn{
    background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
    color:var(--text); font-family:'IBM Plex Mono'; font-size:12px; padding:8px 14px; cursor:pointer;
  }
  #refresh-btn:hover{background:#1A2030; border-color:var(--blue);}

  .analyst-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin-bottom:22px;}
  .analyst-card{
    background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:16px 18px;
    text-decoration:none; color:var(--text); display:block; transition:border-color .15s ease, background .15s ease;
    position:relative;
  }
  .analyst-card:hover{background:var(--panel-2); border-color:var(--blue);}
  .analyst-card .a-name{font-size:12.5px; font-weight:500; color:var(--text-muted); margin-bottom:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:'IBM Plex Mono'; text-transform:uppercase; letter-spacing:0.04em;}
  .analyst-card .a-count{font-family:'IBM Plex Mono'; font-size:26px; font-weight:600; color:var(--normal);}
  .analyst-card .a-count.has-critico{color:var(--critico);}

  .back-link{
    display:inline-block; margin-bottom:16px; color:var(--text-muted); text-decoration:none; font-size:12px;
    font-family:'IBM Plex Mono'; border:1px solid var(--border); padding:7px 14px; border-radius:6px; background:var(--panel-2);
  }
  .back-link:hover{background:#1A2030; color:var(--text);}

  .filter-bar{margin-bottom:20px;}
  .filter-top-row{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .search-wrap{position:relative; width:380px; max-width:100%; height:44px;}
  .search-wrap svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); width:16px; height:16px; stroke:var(--text-dim); pointer-events:none;}
  #search-input{
    width:100%; height:44px; background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
    color:var(--text); font-family:'Inter'; font-size:13px; padding:0 36px 0 40px;
  }
  #search-input::placeholder{color:var(--text-dim);}
  #search-input:focus{outline:2px solid var(--blue); outline-offset:1px; border-color:var(--blue);}
  .search-clear-btn{
    position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none;
    color:var(--text-dim); font-size:14px; cursor:pointer; display:none; line-height:1; padding:4px;
  }
  .search-clear-btn:hover{color:var(--text);}
  .results-count{
    display:flex; align-items:center; gap:8px; height:44px; padding:0 18px;
    background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
    font-size:12.5px; color:var(--text-muted); white-space:nowrap; font-family:'IBM Plex Mono';
  }
  .results-count .rc-value{font-family:'IBM Plex Mono'; font-size:18px; font-weight:600; color:var(--atencao);}

  .cards-container{display:flex; flex-direction:column; gap:12px;}
  .vehicle-card{
    background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:18px 20px;
    border-left:3px solid var(--border); position:relative;
  }
  .vehicle-card::before, .vehicle-card::after{content:''; position:absolute; width:8px; height:8px; border:1px solid var(--text-dim); opacity:0.4;}
  .vehicle-card::before{ top:-1px; right:-1px; border-left:none; border-bottom:none; }
  .vehicle-card::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
  .vehicle-card.row-critico{border-left-color:var(--critico); background:linear-gradient(180deg, var(--critico-dim) 0%, var(--panel) 30%);}
  .vehicle-card.row-atencao{border-left-color:var(--atencao); background:linear-gradient(180deg, var(--atencao-dim) 0%, var(--panel) 30%);}
  .vehicle-card.row-normal{border-left-color:var(--normal); background:linear-gradient(180deg, var(--normal-dim) 0%, var(--panel) 30%);}

  .vc-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:12px;}
  .vc-name{font-family:'Space Grotesk'; font-size:15px; font-weight:600;}
  .vc-sub{color:var(--text-muted); font-size:12px; margin-top:3px;}
  .vc-right{text-align:right; flex-shrink:0;}
  .vc-dias{font-family:'IBM Plex Mono'; font-size:20px; font-weight:600; margin-top:6px; color:var(--text);}

  .vc-field{margin-bottom:10px;}
  .vc-field:last-of-type{margin-bottom:0;}
  .vc-value{color:var(--text); font-size:13px; line-height:1.4;}
  .vc-label.solucao-label{color:var(--atencao);}

  .vc-footer{
    display:flex; gap:22px; flex-wrap:wrap; font-size:11px; color:var(--text-dim);
    border-top:1px solid var(--border); padding-top:10px; margin-top:12px; font-family:'IBM Plex Mono';
  }
  .vc-footer span{color:var(--text-muted); font-family:'Inter';}

  .badge{
    display:inline-block; font-size:10.5px; font-weight:600; padding:3px 9px; border-radius:20px;
    text-transform:uppercase; letter-spacing:0.03em; font-family:'IBM Plex Mono';
  }
  .badge.critico{background:var(--critico-dim); color:#FF8A8A;}
  .badge.atencao{background:var(--atencao-dim); color:#FFC466;}
  .badge.normal{background:var(--normal-dim); color:#5CE8C4;}
  .badge::before{content:''; display:inline-block; width:5px; height:5px; border-radius:50%; background:currentColor; margin-right:5px;}

  .empty-state, .error-state{text-align:center; padding:60px 20px; color:var(--text-muted); font-family:'IBM Plex Mono'; font-size:13px;}
  .error-state{color:var(--critico);}

  footer{margin-top:24px; text-align:center; font-size:11px; color:var(--text-dim); font-family:'IBM Plex Mono';}

  @media (max-width:640px){
    .brand-text h1{font-size:16px;}
    .search-wrap{width:100%;}
    .filter-top-row{flex-direction:column; align-items:stretch;}
  }
</style>
</head>

      <div class="results-count" id="results-count"></div>
    </div>
  </div>

  <div id="table-container" class="cards-container">
    <div class="empty-state">Carregando dados...</div>
  </div>

  <footer>ATUALIZA AUTOMATICAMENTE A CADA 5 MINUTOS · LOC FROTA</footer>

</div>

<script>
  const CSV_URL = "https://docs.google.com/spreadsheets/d/1Bk1LEYRj--LbEZx7gs8CMOlrR4kUcpVp/gviz/tq?tqx=out:csv&gid=1912270550";

  const REFRESH_MS = 5 * 60 * 1000;
  let rawRows = [];
  let headers = [];
  let sortState = { mode: "dias-desc" };
  let filterState = { status: "", bucket: "" };
  const urlParams = new URLSearchParams(location.search);
  const analistaParam = urlParams.get('analista');

  function parseCSV(text){
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for(let i=0;i<text.length;i++){
      const c = text[i], next = text[i+1];
      if(inQuotes){
        if(c === '"' && next === '"'){ field += '"'; i++; }
        else if(c === '"'){ inQuotes = false; }
        else { field += c; }
      } else {
        if(c === '"'){ inQuotes = true; }
        else if(c === ','){ row.push(field); field = ""; }
        else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
        else if(c === '\r'){ /* skip */ }
        else { field += c; }
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(r => r.some(v => v.trim() !== ""));
  }

  function findColumn(names){
    return headers.find(h => names.some(n => h.toLowerCase().includes(n)));
  }

  function classify(diasStr){
    const dias = parseFloat(String(diasStr).replace(",", "."));
    if(isNaN(dias)) return null;
    if(dias >= 4) return "critico";
    if(dias >= 2) return "atencao";
    return "normal";
  }

  function classifyBucket(diasStr){
    const dias = parseFloat(String(diasStr).replace(",", "."));
    if(isNaN(dias)) return null;
    if(dias <= 1) return "0-1";
    if(dias <= 3) return "2-3";
    if(dias <= 10) return "4-10";
    if(dias <= 20) return "11-20";
    if(dias <= 30) return "21-30";
    if(dias <= 60) return "31-60";
    return "61+";
  }

  function render(){
    const diasCol = findColumn(["dias parado", "dias"]);
    const analistaCol = findColumn(["analista"]);
    const statusColRaw = findColumn(["status"]);

    const respColRaw = findColumn(["responsavel", "responsável", "analista"]);

    let rows = rawRows
      .filter(r => {
        if(!respColRaw) return true;
        const idx = headers.indexOf(respColRaw);
        const val = String(r[idx] ?? "").trim();
        if(!val) return false;
        if(/total/i.test(val)) return false;
        if(/^[0-9.,]+$/.test(val)) return false;
        return true;
      })
      .map(r => {
      const obj = {};
      headers.forEach((h,i) => obj[h] = r[i] ?? "");
      let status = null;
      if(statusColRaw){
        const v = obj[statusColRaw].toLowerCase();
        if(v.includes("crit")) status = "critico";
        else if(v.includes("aten")) status = "atencao";
        else if(v.includes("norm")) status = "normal";
      }
      if(!status && diasCol) status = classify(obj[diasCol]);
      obj.__status = status;
      obj.__bucket = diasCol ? classifyBucket(obj[diasCol]) : null;
      return obj;
    });

    const search = document.getElementById("search-input").value.toLowerCase();
    const statusFilter = filterState.status;
    const bucketFilter = filterState.bucket;
    const analistaCol2 = findColumn(["responsavel", "responsável", "analista"]);

    const scopedRows = analistaParam
      ? rows.filter(r => analistaCol2 && String(r[analistaCol2]).trim().toLowerCase() === analistaParam.trim().toLowerCase())
      : rows;

    let filtered = scopedRows.filter(r => {
      const matchesSearch = !search || Object.values(r).some(v => String(v).toLowerCase().includes(search));
      const matchesStatus = !statusFilter || r.__status === statusFilter;
      const matchesBucket = !bucketFilter || r.__bucket === bucketFilter;
      return matchesSearch && matchesStatus && matchesBucket;
    });

    if(sortState.mode === "dias-asc"){
      filtered.sort((a,b) => (parseFloat(String(a[diasCol]).replace(",",".")) || 0) - (parseFloat(String(b[diasCol]).replace(",",".")) || 0));
    } else if(sortState.mode === "nome-asc"){
      filtered.sort((a,b) => String(a[analistaCol2]).localeCompare(String(b[analistaCol2]), 'pt-BR'));
    } else {
      filtered.sort((a,b) => (parseFloat(String(b[diasCol]).replace(",",".")) || 0) - (parseFloat(String(a[diasCol]).replace(",",".")) || 0));
    }

    renderCards(filtered);
    renderDirectory(rows, analistaCol2);
    renderTitle();
    updateResultsCount(filtered.length);
    document.getElementById("search-clear").style.display = search ? "block" : "none";
  }

  function updateResultsCount(n){
    const el = document.getElementById("results-count");
    const label = n === 1 ? "veículo encontrado" : "veículos encontrados";
    el.innerHTML = `<span class="rc-value">${n}</span><span>${label}</span>`;
  }

  function renderTitle(){
    const titleEl = document.getElementById("page-title");
    const subtitleEl = document.getElementById("page-subtitle");
    if(analistaParam){
      titleEl.textContent = analistaParam;
      subtitleEl.innerHTML = '<a href="' + location.pathname + '" class="back-link" style="margin:0;display:inline-block;">← Ver todos os analistas</a>';
    } else {
      titleEl.textContent = "Frota parada >3";
      subtitleEl.textContent = "LOC FROTA · CONTROLE DIÁRIO";
    }
  }

  function renderDirectory(rows, analistaCol2){
    const container = document.getElementById("analyst-directory");
    if(analistaParam || !analistaCol2){ container.innerHTML = ""; return; }

    const counts = {};
    rows.forEach(r => {
      const name = String(r[analistaCol2]).trim();
      if(!name) return;
      if(!counts[name]) counts[name] = { total: 0, critico: 0 };
      counts[name].total++;
      if(r.__status === "critico") counts[name].critico++;
    });

    const names = Object.keys(counts).sort((a,b) => counts[b].total - counts[a].total);
    if(!names.length){ container.innerHTML = ""; return; }

    const cards = names.map(name => {
      const c = counts[name];
      const cls = c.critico > 0 ? "has-critico" : "";
      const url = location.pathname + "?analista=" + encodeURIComponent(name);
      return `<a class="analyst-card" href="${url}"><div class="a-name">${name}</div><div class="a-count ${cls}">${c.total}</div></a>`;
    }).join("");

    container.innerHTML = `<div class="analyst-grid">${cards}</div>`;
  }

  function renderCards(rows){
    const container = document.getElementById("table-container");
    if(!rows.length){
      container.innerHTML = '<div class="empty-state">Nenhum registro encontrado.</div>';
      return;
    }

    const placaCol = findColumn(["placa"]);
    const modeloCol = findColumn(["modelo"]);
    const clienteCol = findColumn(["cliente"]);
    const diasCol2 = findColumn(["dias parado", "dias"]);
    const pendCol = findColumn(["pendencia", "pendência"]);
    const statusCol = findColumn(["status atual", "status"]);
    const reservaCol = findColumn(["veiculo reserva", "veículo reserva", "reserva"]);
    const solucaoCol = findColumn(["solucao", "solução"]);
    const fornecedorCol = findColumn(["fornecedor"]);
    const respCol = findColumn(["responsavel", "responsável", "analista"]);
    const prazoCol = findColumn(["prazo liberacao", "prazo liberação", "prazo"]);

    const statusLabel = { critico: "Crítico", atencao: "Atenção", normal: "Normal" };

    container.innerHTML = rows.map(r => {
      const rowClass = r.__status ? `row-${r.__status}` : "";
      const dias = diasCol2 ? r[diasCol2] : "";
      return `
        <div class="vehicle-card ${rowClass}">
          <div class="vc-head">
            <div>
              <div class="vc-name">${respCol ? r[respCol] : ""}</div>
              <div class="vc-sub mono">${placaCol ? r[placaCol] : ""}${modeloCol ? " · " + r[modeloCol] : ""}</div>
            </div>
            <div class="vc-right">
              ${r.__status ? `<span class="badge ${r.__status}">${statusLabel[r.__status]}</span>` : ""}
              <div class="vc-dias">${dias}${dias !== "" ? " dias" : ""}</div>
            </div>
          </div>
          ${clienteCol ? `<div class="vc-field"><div class="eyebrow">Cliente</div><div class="vc-value">${r[clienteCol]}</div></div>` : ""}
          ${pendCol ? `<div class="vc-field"><div class="eyebrow">Pendência</div><div class="vc-value">${r[pendCol]}</div></div>` : ""}
          ${solucaoCol ? `<div class="vc-field"><div class="eyebrow solucao-label">Solução</div><div class="vc-value">${r[solucaoCol]}</div></div>` : ""}
          <div class="vc-footer">
            ${statusCol ? `<div>Status atual: <span>${r[statusCol]}</span></div>` : ""}
            ${prazoCol && r[prazoCol] ? `<div>Prazo de liberação: <span>${r[prazoCol]}</span></div>` : ""}
            ${reservaCol ? `<div>Veículo reserva: <span>${r[reservaCol]}</span></div>` : ""}
            ${fornecedorCol ? `<div>Fornecedor: <span>${r[fornecedorCol]}</span></div>` : ""}
          </div>
        </div>`;
    }).join("");
  }

  function setStatusDot(ok){
    document.getElementById("status-dot").className = ok ? "live-dot" : "live-dot stale";
  }

  async function loadData(){
    if(CSV_URL.includes("COLE_AQUI")){
      document.getElementById("table-container").innerHTML =
        '<div class="error-state">Configure a variável CSV_URL no início do arquivo com o link do seu Google Sheets publicado.</div>';
      document.getElementById("last-update").textContent = "Não configurado";
      setStatusDot(false);
      return;
    }
    try{
      const res = await fetch(CSV_URL + (CSV_URL.includes("?") ? "&" : "?") + "t=" + Date.now());
      if(!res.ok) throw new Error("Falha ao buscar CSV");
      const text = await res.text();
      const parsed = parseCSV(text);
      headers = parsed[0].map(h => h.trim());
      rawRows = parsed.slice(1);
      render();
      document.getElementById("last-update").textContent = "Atualizado às " + new Date().toLocaleTimeString('pt-BR');
      setStatusDot(true);
    } catch(err){
      document.getElementById("table-container").innerHTML =
        '<div class="error-state">Erro ao carregar dados. Verifique se o link do CSV está correto e publicado.</div>';
      document.getElementById("last-update").textContent = "Erro na última tentativa";
      setStatusDot(false);
    }
  }

  document.getElementById("search-input").addEventListener("input", render);

  document.getElementById("search-clear").addEventListener("click", () => {
    document.getElementById("search-input").value = "";
    render();
  });

  loadData();
  setInterval(loadData, REFRESH_MS);
</script>

</body>
</html>
